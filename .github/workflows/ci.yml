name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only build and test the code: the token needs nothing but read access
permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        cc: [gcc, clang]
        exclude:
          # gcc on macOS is an alias for clang
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v7
      - run: make CC=${{ matrix.cc }} all test
      - run: make CC=${{ matrix.cc }} smoke
      - run: make CXX=${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }} cxx
      - run: make CC=${{ matrix.cc }} bench
      - name: C23 (the tests, and [[nodiscard]] on argh_parse)
        run: make CC=${{ matrix.cc }} c23

  sanitizers:
    name: ubuntu / clang / ASan + UBSan + TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Fuzz argh_parse for 2 minutes
        run: make fuzz FUZZ_TIME=120
      - name: Parsing in 8 threads at once, under ThreadSanitizer
        # TSan needs the smaller address randomization of older kernels
        run: sudo sysctl vm.mmap_rnd_bits=28 && make CC=clang thread-check
      - name: Reduced release build (ARGH_NO_COMMANDS, ARGH_NO_SUGGEST, ARGH_NO_STDIO, ARGH_NO_FLOAT, ARGH_HELP_WIDTH=0, NDEBUG)
        run: >
          make clean && make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -DARGH_NO_COMMANDS -DARGH_NO_SUGGEST -DARGH_NO_STDIO -DARGH_NO_FLOAT -DARGH_HELP_WIDTH=0 -DNDEBUG
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

  # README, examples/README and llms.txt: code compiles, output is real
  docs:
    name: docs / examples match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docs-check

  # Small changes to argh.h, one at a time: do the tests notice each one?
  mutation:
    name: mutation / tests catch changes to argh.h
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make mutation

  coverage:
    name: coverage / argh.h lines run by the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make coverage

  # The completion scripts, loaded in each shell: what does Tab offer?
  completion:
    name: completion / bash, zsh, fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: ARGH_COMPLETION_STRICT=1 make completion-check

  # Every documented way to use argh as a package, built and run
  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Meson (Linux)
        if: runner.os == 'Linux'
        run: pipx install meson && sudo apt-get install -y ninja-build
      - name: Conan
        shell: bash
        run: pipx install conan && conan profile detect
      - name: Tests through CMake and CTest
        shell: bash
        run: |
          cmake -S . -B build
          cmake --build build --config Debug
          ctest --test-dir build -C Debug --output-on-failure
      - name: find_package, FetchContent, add_subdirectory, pkg-config, Conan, Meson
        shell: bash
        # Linux has every tool, so a missing one fails there
        run: ARGH_PACKAGE_STRICT=${{ runner.os == 'Linux' && '1' || '0' }} sh tests/package/check.sh

  # 32-bit x86: 4-byte long and pointers, the sizes most firmware has
  x86-32:
    name: ubuntu / gcc -m32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: make all test smoke CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -m32"

  # Other architectures under qemu: 32-bit ARM, and big-endian in 64 and
  # 32 bits. Static binaries run through binfmt like native ones.
  cross:
    name: linux / ${{ matrix.arch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            triplet: arm-linux-gnueabihf
          - arch: s390x, big-endian
            triplet: s390x-linux-gnu
          - arch: powerpc, big-endian 32-bit
            triplet: powerpc-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static gcc-${{ matrix.triplet }}
      - run: >
          make all test smoke CC=${{ matrix.triplet }}-gcc
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -static"

  arm:
    name: arm / cortex-m0, m4 / flash budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: make size-arm

  mingw:
    name: windows / mingw gcc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: make all test
      - run: make smoke
      - run: make bench

  msvc:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /W4 /std:c11 tests\test_argh.c /Fe:test_argh.exe || exit /b 1
          test_argh.exe || exit /b 1
          cl /nologo /W4 /std:c11 tests\nostdio_check.c /Fe:nostdio_check.exe || exit /b 1
          nostdio_check.exe || exit /b 1
          cl /nologo /W4 /WX /std:c11 tests\static_check.c tests\static_check_other.c /Fe:static_check.exe || exit /b 1
          static_check.exe -v || exit /b 1
          cl /nologo /std:c11 tests\settings_main.c tests\settings_impl.c /Fe:settings_mismatch.exe >nul 2>&1 && (echo FAIL: files with different settings linked & exit /b 1) || echo files with different settings: rejected at link time
          cl /nologo /W4 /std:c11 /DFUZZ_REPLAY tests\fuzz_argh.c /Fe:fuzz_replay.exe || exit /b 1
          for %%f in (tests\fuzz\*) do fuzz_replay.exe %%f || exit /b 1
          cl /nologo /W4 /WX /std:c++17 /EHsc tests\cxx_check.cpp /Fe:cxx_check.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\wc.c /Fe:examples\wc.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\logship.c /Fe:examples\logship.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\pkg\main.c examples\pkg\install.c examples\pkg\remote.c examples\pkg\exec.c /Fe:examples\pkg\pkg.exe || exit /b 1
      - name: Smoke-test the examples
        shell: bash
        run: sh examples/smoke.sh
