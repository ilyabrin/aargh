name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          # gcc on macOS is an alias for clang
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v7
      - run: make CC=${{ matrix.cc }} all test
      - run: make CC=${{ matrix.cc }} smoke
      - run: make CXX=${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }} cxx
      - run: make CC=${{ matrix.cc }} bench

  sanitizers:
    name: ubuntu / clang / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Fuzz argh_parse for 2 minutes
        run: make fuzz FUZZ_TIME=120
      - name: Reduced release build (ARGH_NO_COMMANDS, ARGH_NO_SUGGEST, ARGH_NO_STDIO, ARGH_NO_FLOAT, NDEBUG)
        run: >
          make clean && make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -DARGH_NO_COMMANDS -DARGH_NO_SUGGEST -DARGH_NO_STDIO -DARGH_NO_FLOAT -DNDEBUG
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

  arm:
    name: arm / cortex-m0, m4 / flash budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: make size-arm

  mingw:
    name: windows / mingw gcc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: make all test
      - run: make smoke
      - run: make bench

  msvc:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /W4 /std:c11 tests\test_argh.c /Fe:test_argh.exe || exit /b 1
          test_argh.exe || exit /b 1
          cl /nologo /W4 /std:c11 tests\nostdio_check.c /Fe:nostdio_check.exe || exit /b 1
          nostdio_check.exe || exit /b 1
          cl /nologo /W4 /WX /std:c11 tests\static_check.c tests\static_check_other.c /Fe:static_check.exe || exit /b 1
          static_check.exe -v || exit /b 1
          cl /nologo /std:c11 tests\settings_main.c tests\settings_impl.c /Fe:settings_mismatch.exe >nul 2>&1 && (echo FAIL: files with different settings linked & exit /b 1) || echo files with different settings: rejected at link time
          cl /nologo /W4 /std:c11 /DFUZZ_REPLAY tests\fuzz_argh.c /Fe:fuzz_replay.exe || exit /b 1
          for %%f in (tests\fuzz\*) do fuzz_replay.exe %%f || exit /b 1
          cl /nologo /W4 /WX /std:c++17 /EHsc tests\cxx_check.cpp /Fe:cxx_check.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\wc.c /Fe:examples\wc.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\logship.c /Fe:examples\logship.exe || exit /b 1
          cl /nologo /W4 /std:c11 examples\pkg\main.c examples\pkg\install.c examples\pkg\remote.c examples\pkg\exec.c /Fe:examples\pkg\pkg.exe || exit /b 1
      - name: Smoke-test the examples
        shell: bash
        run: sh examples/smoke.sh
